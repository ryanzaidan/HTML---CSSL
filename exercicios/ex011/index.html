<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <p>tente abrir esse site em diversos dispositivos diferentes ou simplismente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/fotop1.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/fotoM2.png" type="image/png">
        <img src="imagens/fotog2.png" alt="Imagem Flexivel">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender como colocar audio em html5</p>
    <audio src="midia/Paradise Anno DominiBeats.mp3" controls autoplay></audio>
   
</body>
</html>
