<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<style>

    body {
        font-family: Arial, Helvetica, sans-serif;
    }
    table {
        width: 600px;
        border-collapse: collapse;
    }

    td {
        border: 1px solid black;
        text-align: center;
        padding: 10px;
        
    }
</style>
<body>
    <h1>Mesclagem de Celular</h1>
    <table>
        <thead>

        </thead>
        <tbody>
            <tr>
                <td>A</td>
                <td>B</td>
                <td rowspan="6">C</td>
            </tr>
            <tr>
                <td colspan="2">D</td>
                
                
            </tr>
            <tr>
                <td>G</td>
                
                
            </tr>
        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
