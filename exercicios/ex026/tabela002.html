<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    table {
        width: 600px;
    }
    .num {
        text-align: right;
    }

    td, th {
        border: 1px solid black;
        vertical-align: middle;
        text-align: center;
        padding: 10px;
    }
    thead {
        background-color: gray;
        color: white
    }

    tbody > tr:nth-child(odd) {
        background-color: gray
    }

    caption {
        font-weight: bold;
        font-size: 26px;
        background-color: aquamarine;
        padding: 10px;
        border: 1px solid black;
    }


    thead, tfoot {
        background-color: gray;
        color: white;
    }
</style>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption>Unidades estaduais federais</caption>
        <thead>
           <th scope="col">Estado</th>
           <th scope="col">População</th>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">50.000,00</td>
            </tr>
            <tr>
                <td>Destrito Federal</td>
                <td class="num">250.000,00</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">500.000,00</td>
            </tr>
        </tbody>
        <tfoot>
            <td>Total de habitantes</td>
            <td>0000000</td>
        </tfoot>
    </table>
</body>
</html>
